name: Deploy web app

# 예전에 쓰시던 흐름과 같은 자리입니다.
#   git push -> Actions -> Pages 배포 -> 앱을 여는 순간 최신
# webhook 도 서버 스크립트도 필요 없습니다. GitHub 이 그 역할을 합니다.
#
# 배포는 "기본 브랜치"에서만 됩니다. github-pages 환경이 기본 브랜치만
# 허용하기 때문에, 기본 브랜치가 아닌 곳에서 돌리면 로그 한 줄 없이
# 몇 초 만에 실패합니다. Settings -> General -> Default branch 를
# main 으로 맞춰 두세요.
on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'docs/**'
      - 'tools/test_core.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 살린다. 연달아 푸시해도 마지막 상태로 수렴한다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 배포 전에 판단 규칙이 깨지지 않았는지 먼저 확인한다. 몇 초면 끝난다.
      - name: Test core logic
        run: node tools/test_core.mjs

      # 배포하면 곧바로 가족 모두에게 반영되므로, 화면이 깨진 채로 나가면
      # 걸러 줄 사람이 없다. 진짜 브라우저로 첫 설정부터 체크까지 눌러 본다.
      - name: Test screen flow
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          node tools/test_flow.mjs

      - name: Assemble site
        run: |
          # 서비스 워커가 캐시를 갈아치우는 기준이자, 화면에 표시할 버전이다.
          # 초까지 넣는다. 화면에 그대로 띄워 "지금 보는 것이 언제 배포된 것인지"를
          # 사용자가 바로 확인할 수 있어야 한다.
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          # ui.js 도 반드시 넣어야 한다. 여기서 core.js 를 부르는 주소에 버전이
          # 붙는데, 빠뜨리면 로직이 담긴 core.js 가 캐시에 걸린 채로 남는다.
          sed -i "s/__BUILD__/${stamp}/g" web/sw.js web/index.html web/core.js web/ui.js
          # Pages 소스가 하나뿐이라 개인정보처리방침도 같은 사이트에 실어야
          # 기존 주소(.../privacy.html)가 그대로 살아 있다.
          cp docs/privacy.html web/privacy.html
          # 앱이 "새 배포가 있나"를 물어볼 아주 작은 파일. 몇 바이트라 자주 물어도 된다.
          printf '%s' "${stamp}" > web/version.txt
          echo "배포 버전: ${stamp}"

      # Pages 는 사람이 한 번 켜야 한다(완료됨).
      #   저장소 -> Settings -> Pages -> Source 를 "GitHub Actions" 로
      # enablement 는 액션이 직접 켜 보라는 뜻인데, 워크플로 토큰에는 저장소
      # 설정을 바꿀 권한이 없어 실패한다. 켜져 있으면 무시되므로 남겨 둔다.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
